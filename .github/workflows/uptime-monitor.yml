name: FlowGuard uptime monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    name: Check production services
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLOWGUARD_API_URL: https://flowguard-z4kk.onrender.com
      FLOWGUARD_FRONTEND_URL: https://flowguard-error-handlers.vercel.app
      FLOWGUARD_MONITOR_TIMEOUT_MS: "20000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Render health, Vercel availability, and CORS
        run: node scripts/uptime-monitor.mjs
